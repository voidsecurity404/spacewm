[package]
name = "spacewm"
version = "0.0.1"
edition = "2021"
rust-version = "1.99"
description = "A 3D Wayland compositor: windows as panels in a voxel world"
license = "MIT"
# `cargo run` starts the compositor (spacectl: `cargo run --bin spacectl`).
default-run = "spacewm"

[dependencies]
# smithay from git main: the crates.io release lags behind and most examples
# (smallvil, anvil, niri) track main.
smithay = { git = "https://github.com/Smithay/smithay", default-features = false, features = [
    "backend_winit",
    "backend_drm",
    "backend_gbm",
    "backend_egl",
    "backend_libinput",
    "backend_session_libseat",
    "backend_udev",
    "renderer_gl",
    "renderer_glow",
    "wayland_frontend",
    "desktop",
    "xwayland",
] }
# Connector scanning and EDID (monitor make/model) for the DRM backend.
smithay-drm-extras = { git = "https://github.com/Smithay/smithay" }
# We never `use calloop::` directly — code goes through `smithay::reexports::calloop`
# so the versions can't drift apart. This line exists only to switch on the
# `signals` feature (SIGINT/SIGTERM as an event source). Cargo merges features of
# the same crate version, so smithay's calloop gets it too.
calloop = { version = "0.14", features = ["signals"] }
glam = "0.30"
anyhow = "1"
thiserror = "2"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter", "fmt"] }
clap = { version = "4", features = ["derive"] }
serde = { version = "1", features = ["derive"] }
toml = "0.9"
# Editing the config file from the settings box without losing its comments.
toml_edit = "0.25"
directories = "6"
serde_json = "1"
shell-words = "1"
# Unix socket credentials (SO_PEERCRED) and uid lookups for the IPC socket.
rustix = { version = "1", features = ["net", "process", "fs"] }
# Signal mask reset in spawned children (see spawn.rs).
libc = "0.2"
xcursor = "0.3"
# EGL window surfaces on a Wayland host (our own nested backend, see backend/winit.rs).
wayland-egl = "0.32"
png = "0.18"
# The map textures (resources/maps/*/textures) are JPEGs: a small, pure-Rust decoder.
zune-jpeg = "0.4"
# The character (resources/characters/*.glb): glTF with skeleton and animations. Only
# the parser: the file is one .glb with everything inside, so no file loading or image
# crates are needed (its PNG texture goes through `png`).
gltf = { version = "1", default-features = false, features = ["utils", "names"] }
# Safe casts of vertex structs to bytes for GL buffer uploads.
bytemuck = { version = "1", features = ["derive"] }
notify = { version = "8", default-features = false }
fontdue = "0.9"
tracing-tracy = { version = "0.12.0", optional = true }

[features]
# Profiling with tracy (https://github.com/wolfpld/tracy): cargo run --features profile
profile = ["dep:tracing-tracy"]

[[bin]]
name = "spacewm"
path = "src/main.rs"

[[bin]]
name = "spacectl"
path = "src/bin/spacectl.rs"

[profile.dev]
# 3D math and voxel meshing are painfully slow at opt-level 0.
opt-level = 1

[profile.dev.package."*"]
# Dependencies are compiled once, so optimize them fully even in dev builds.
opt-level = 3

[profile.release]
lto = "thin"
# Keep line tables so crash backtraces from a DRM session are readable.
debug = 1

# Test clients (examples/): a minimal session locker for the e2e tests.
[dev-dependencies]
wayland-client = "0.31"
wayland-protocols = { version = "0.32", features = ["client", "staging"] }

