# xdg-desktop-portal backend selection for spacewm.
# Install to /usr/share/xdg-desktop-portal/spacewm-portals.conf — see `just install`.
#
# Portals are how sandboxed (Flatpak) and modern apps ask the desktop for things they
# may not do themselves: open a file picker, take a screenshot, share the screen.
# xdg-desktop-portal reads XDG_CURRENT_DESKTOP=spacewm, loads this file, and forwards
# each request to a backend:
# - gtk: file chooser, app chooser, settings (dark mode) — works on any compositor.
# - wlr: screenshot and screencast — needs wlr-screencopy, which spacewm gets in
#   Stage 7.5; until then those requests fail cleanly.
[preferred]
default=gtk
org.freedesktop.impl.portal.Screenshot=wlr
org.freedesktop.impl.portal.ScreenCast=wlr
